</style></head><body><div class="stage"><aside class="intro"><div class="eyebrow">OPAQUE / Design review</div><h1>A quiet place<br>for your thoughts.</h1><p>Notes preview · sample content only.<br>Try search, categories, note actions, and the editor. Changes stay in this preview.</p><p><a href="http://127.0.0.1:8767/" style="color:#5279b2;font-size:12px">Open chat-sharing preview ↗</a></p><div class="controls"><button id="theme" aria-pressed="false">Dark mode</button><button id="empty">Empty state</button><button id="reset">Reset</button></div></aside><div class="phone" id="phone"><div class="status"><span>9:41</span><span><i data-icon="signal"></i><i data-icon="wifi"></i><i data-icon="battery"></i></span></div><header class="header"><button class="icon avatar" aria-label="Your profile" id="profile">V</button><div class="wordmark" aria-label="OPAQUE"><span class="mark"></span>PAQUE</div><button class="icon" aria-label="More options" id="menuButton"><i data-icon="more"></i></button></header><main><section id="browse" style="display:flex;flex-direction:column;flex:1;min-height:0"><label class="search"><i data-icon="search"></i><input id="search" placeholder="Search notes" aria-label="Search notes"></label><div class="filters" id="filters"></div><div class="count"><span id="count"></span><span>Last edited</span></div><div class="list" id="list"></div><button class="add" id="add" aria-label="New note"><i data-icon="plus"></i></button></section><section id="editor" class="editor" hidden><div class="editor-top"><button class="icon" id="back" aria-label="Back to notes"><i data-icon="back"></i></button><span id="editorCaption">Edit note</span><button class="save" id="save">Save</button></div><div class="editor-content"><input class="title-input" id="title" placeholder="Title" aria-label="Note title"><div class="editor-meta"><select id="category" aria-label="Category"><option>No category</option><option>Personal</option><option>Ideas</option><option>Study</option></select><s const seed=[{id:1,title:'Small things worth keeping',body:'The light through the window at 5 pm.\nA conversation that stayed with me.\nRemember to make room for both.',category:'Personal',pin:true,time:'10:42'},{id:2,title:'A thought for the next version',body:'Make the everyday things feel effortless. Less noise, a little more space, and details that feel familiar.',category:'Ideas',pin:true,time:'Yesterday'},{id:3,title:'Before the weekend',body:'Finish the reading list. Call home. Find a new place for coffee and take the long way back.',category:'Personal',pin:false,time:'Yesterday'},{id:4,title:'Design notes',body:'Clarity comes from what we choose to leave out. Keep the useful things close, and the rest out of the way.',category:'Study',pin:false,time:'17 Sep'},{id:5,title:'Things to explore',body:'A simple sketch. An unexpected colour. A better way to connect two ideas.',category:'Ideas',pin:false,time:'16 Sep'}];let notes=structuredClone(seed),filter='All',editing=null,timer,pendingDelete=null,forceEmpty=false;

openNote(n)},{label:'Delete',ic:'trash',fn:()=>{$('dialogTitle').textContent='Delete note?';$('dialogCopy').textContent='This removes the sample note from this preview.';pendingDelete=n.id;$('dialog').hidden=false}}],Math.min(more.getBoundingClientRect().bottom-$('phone').getBoundingClientRect().top,520))};row.append(b,more);$('list').append(row)}}

root.addEventListener('click',e=>{if(!e.target.closest('[data-more], [data-chat-menu]')){q('[data-chat-menu]').hidden=true;q('[data-more]').setAttribute('aria-expanded','false')}});q('[data-draft]').oninput=syncComposer;
q('[data-attach]').onclick=()=>{const open=q('[data-attachments]').hidden;closePanels();q('[data-attachments]').hidden=!open;q('[data-attach]').setAttribute('aria-expanded',String(open))};
let aiToastTimer;q('[data-ai]').onclick=()=>{closePanels();clearTimeout(aiToastTimer);q('[data-ai-toast]').hidden=false;aiToastTimer=setTimeout(()=>{q('[data-ai-toast]').hidden=true},3000)};
root.querySelectorAll('[data-close-panel]').forEach(b=>b.onclick=closePanels);
root.querySelectorAll('[data-chat-call]').forEach(b=>b.onclick=()=>feedback(b.dataset.chatCall+' call · interface preview'));
root.querySelectorAll('[data-share]').forEach(b=>b.onclick=()=>{closePanels();feedback(b.dataset.share+' picker selected · interface preview')});
root.querySelectorAll('[data-assist]').forEach(b=>b.onclick=()=>{const input=q('[data-draft]');if(b.dataset.assist==='reply'){input.value='Sounds good! See you at four.';feedback('Sample reply inserted for review.')}else if(input.value.trim()){const draft=input.value.trim();input.value=draft.charAt(0).toUpperCase()+draft.slice(1)+( /[.!?]$/.test(draft)?'':'.');feedback('Preview: draft formatting polished.')}else{feedback('Write a draft first, then choose Polish.')}closePanels();syncComposer();input.focus()});
root.addEventListener('keydown',e=>{if(e.key==='Escape'){closePanels();if(recording){recording=false;feedback('');syncComposer()}}});
q('.ol-composer').onsubmit=e=>{e.preventDefault();closePanels();const input=q('[data-draft]');if(input.value.trim()){bubble(input.value.trim(),true);input.value='';feedback('');q('[data-messages]').scrollTop=q('[data-messages]').scrollHeight}else{recording=!recording;feedback(recording?'Voice note preview · tap stop to finish. No audio is captured.':'Voice note preview stopped.')}syncComposer()};render();icon();if(globalThis.Tweak){const t=new Tweak({container:root,onChange:render});t.addToggle(options,'rounded',{label:'Rounded frame'});t.addToggle(options,'emptyCalls',{label:'Empty calls page'})}
})();
</script>

tline-offset:3px}@media(max-width:760px){.review-layout{flex-direction:column;gap:24px;padding:24px 12px}.review-intro{width:min(360px,100%)}.review-intro h1{font-size:27px;margin:12px 0}.review-intro p{margin:8px 0}.review-controls{margin-top:15px}#opaque-preview{width:min(360px,100%)}}

<script>
(()=>{
const root=document.getElementById('opaque-preview'),phone=root.querySelector('.ol-phone');
const layout=document.createElement('div');layout.className='review-layout';root.before(layout);layout.innerHTML=`<aside class="review-intro"><small>OPAQUE · HOME PREVIEW</small><h1>A simpler menu.<br>A clearer goodbye.</h1><p>The Home menu, with familiar options and a calmer logout confirmation.</p><div class="review-controls"><button id="hm-light" aria-pressed="true">Light</button><button id="hm-dark" aria-pressed="false">Dark</button></div><div class="review-controls"><button id="hm-menu">Open menu</button><button id="hm-dialog">Logout dialog</button></div><p>Preview only. No account changes.</p></aside>`;layout.append(root);
const paths={settings:'<path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="var(--hm-bg)"/><circle cx="15" cy="17" r="3" fill="var(--hm-bg)"/>',backup:'<path d="M4 10a8 8 0 1 1 1 8M4 4v6h6M12 16V8m-3 3 3-3 3 3"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/>',logout:'<path d="M9 4H4v16h5M10 12h11m-4-4 4 4-4 4"/>',phone:'<rect x="6" y="2" width="12" height="20" rx="3"/><path d="M10 18h4"/>'};
const icon=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[n]}</svg>`;
const menu=root.querySelector('[data-home-menu]'),trigger=root.querySelector('[data-home-more]');
menu.innerHTML=[['settings','Settings'],['backup','Backup / Restore'],['info','About']].map(([i,t])=>`<button data-option="${i}">${icon(i)}<span>${t}</span></button>`).join('')+`<div class="hm-rule"></div><button class="hm-logout" data-option="logout">${icon('logout')}<span>Log out</span></button>`;
const overlay=document.createElement('div');overlay.className='hm-overlay';overlay.hidden=true;overlay.innerHTML=`<section class="hm-dialog" role="dialog" aria-modal="true" aria-labelledby="hm-title" aria-describedby="hm-description"><div class="hm-symbol">${icon('logout')}</div><h2 id="hm-title">Log out of Opaque?</h2><p id="hm-description">You can sign back in whenever you're ready.</p><div class="hm-preserved">${icon('phone')}<span><strong>Your messages stay here</strong>Logging out keeps your messages on this phone.</span></div><div class="hm-buttons"><button id="hm-cancel">Cancel</button><button class="hm-confirm" id="hm-confirm">Log out</button></div></section>`;phone.append(overlay);
const toast=document.createElement('div');toast.className='hm-toast';toast.setAttribute('role','status');toast.hidden=true;phone.append(toast);let timer,focusBefore;
function notify(text){clearTimeout(timer);toast.textContent=text;toast.hidden=false;timer=setTimeout(()=>toast.hidden=true,2600)}
function openMenu(){menu.hidden=false;trigger.setAttribute('aria-expanded','true')}
function closeMenu(){menu.hidden=true;trigger.setAttribute('aria-expanded','false')}
function closeDialog(){overlay.hidden=true;[...phone.children].forEach(e=>e.inert=false);(focusBefore?.isConnected?focusBefore:trigger).focus()}
function openDialog(){focusBefore=trigger;closeMenu();overlay.hidden=false;[...phone.children].forEach(e=>e.inert=e!==overlay&&e!==toast);document.getElementById('hm-cancel').focus()}
menu.querySelectorAll('button').forEach(b=>b.onclick=()=>{closeMenu();if(b.dataset.option==='logout')openDialog();else notify(b.textContent+' selected · preview')});
document.getElementById('hm-cancel').onclick=closeDialog;document.getElementById('hm-confirm').onclick=()=>{closeDialog();notify('Logout preview complete. You are still signed in.')};overlay.onclick=e=>{if(e.target===overlay)closeDialog()};
overlay.addEventListener('keydown',e=>{if(e.key==='Escape'){e.stopPropagation();closeDialog()}if(e.key==='Tab'){const a=document.getElementById('hm-cancel'),b=document.getElementById('hm-confirm');if(e.shiftKey&&document.activeElement===a){e.preventDefault();b.focus()}else if(!e.shiftKey&&document.activeElement===b){e.preventDefault();a.focus()}}});
for(const theme of ['light','dark'])document.getElementById('hm-'+theme).onclick=()=>{root.dataset.theme=theme;for(const t of ['light','dark'])document.getElementById('hm-'+t).setAttribute('aria-pressed',String(t===theme))};
document.getElementById('hm-menu').onclick=()=>{if(!overlay.hidden)closeDialog();openMenu()};document.getElementById('hm-dialog').onclick=openDialog;openMenu();
})();

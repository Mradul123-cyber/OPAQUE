</style></head><body><div class="stage"><aside class="intro"><div class="eyebrow">OPAQUE · ACCOUNT PREVIEW</div><h1>A familiar welcome.<br>From the first step.</h1><p>Login and the complete registration journey, brought into the Opaque design.</p><div class="controls"><button id="light" aria-pressed="true">Light</button><button id="dark" aria-pressed="false">Dark</button></div><nav class="steps" aria-label="Preview screens"></nav><label class="option"><input type="checkbox" id="googlePath">Google registration path</label><label class="option"><input type="checkbox" id="conflict">Profile username conflict</label><p>Interactive design preview. Use sample details only. No accounts are created and no verification messages are sent.</p></aside><section class="phone" id="phone" aria-label="Opaque account preview"><div class="status">9:41<span id="statusIcons"></span></div><header class="header"><button class="icon" id="back" aria-label="Go back"></button><div class="wordmark"><span class="mark"></span>PAQUE</div><span style="width:42px"></span></header><main id="content"></main><div class="footer" id="footer"></div><div class="gesture"></div><div class="overlay" id="overlay" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" tabindex="-1"></section></div><div class="toast" role="status" id="toast" hidden></div></section></div><script>
const $=id=>document.getElementById(id),paths={back:'<path d="m14 6-6 6 6 6M8 12h12"/>',close:'<path d="m6 6 12 12M6 18 18 6"/>',eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>',mail:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="m3 6 9 7 9-7"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V6a4 4 0 0 1 8 0v4M12 14v3"/>',phone:'<rect x="6" y="2" width="12" height="20" rx="3"/><path d="M10 18h4"/>',camera:'<path d="M3 7h5l2-3h4l2 3h5v13H3z"/><circle cx="12" cy="13" r="3"/>',check:'<path d="m5 12 4 4L19 6"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/>',signal:'<path d="M3 20v-4M8 20v-8M13 20V8M18 20V4"/>',wifi:'<path d="M2 8a16 16 0 0 1 20 0M5 12a11 11 0 0 1 14 0M8 16a6 6 0 0 1 8 0M12 20h.01"/>',battery:'<rect x="2" y="6" width="18" height="12" rx="2"/><path d="M23 10v4M5 9h12v6H5z"/>'},icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${paths[n]}</svg>`;
$('statusIcons').innerHTML=icon('signal')+icon('wifi')+icon('battery');$('footer').innerHTML=icon('lock')+'A private place for your conversations.';
const names=['Login','Create account','Verify email','Set up profile','Phone details','Verify phone'];let page=0,google=false,conflict=false,photo=false,timer,countdownTimer,seconds=0,focusBefore;const data={username:'',email:'',password:'',displayName:'',phoneNumber:'',code:''};const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function go(n){page=n;clearInterval(countdownTimer);render();$('content').scrollTop=0}

const step=google?(page===3?2:page===4?3:page===5?4:1):page;let html=page>0?`<div class="progress" aria-label="Step ${step} of ${google?4:5}">${Array.from({length:google?4:5},(_,i)=>`<span class="${i<step?'done':''}"></span>`).join('')}</div>`:'';
if(page===0||page===1){html+=`<div class="kicker">${page===0?'WELCOME TO OPAQUE':'YOUR ACCOUNT'}</div><h2>${page===0?'Good to have<br>you back.':'Start a conversation.<br>Make it yours.'}</h2><p class="sub">${page===0?'Sign in to pick up where you left off.':'Create your account to get started.'}</p><button class="google" id="google"><b aria-hidden="true">G</b>Continue with Google</button><div class="or">or use your email</div><form id="form">${page===1?field('Username','username','Choose a username'):''}${field('Email address','email','you@example.com','email','required')}${field('Password','password',page===0?'Enter your password':'Create a strong password','password','required')}${page===1?'<div class="strength" id="strength"><span></span><span></span><span></span><span></span></div><p class="hint" id="passwordHint">8+ characters, with uppercase, lowercase and a number.</p>':''}<div id="error" class="errorbox" role="alert"></div><button class="primary" type="submit">${page===0?'Log in':'Create account'}</button></form><p class="switch">${page===0?'New to Opaque?':'Already have an account?'}<button class="link" id="switch">${page===0?'Create account':'Log in'}</button></p>`}
if(page===2){html+=`<div class="symbol">${icon('mail')}</div><h2>Check your inbox.</h2><p class="sub">Open the verification link we sent to confirm your email address.</p><div class="notice">Verification email sent to<strong class="address">${escape(data.email||'you@example.com')}</strong></div><button class="primary" id="verified">I’ve verified my email</button><button class="secondary resend" id="resendEmail">Resend email</button><p class="auto">Checking automatically every 5 seconds</p><div class="center"><button class="link" id="help">Email not received?</button></div><div class="center"><button class="link" id="cancel">Cancel registration</button></div>`}

if(page===4){html+=`<div class="symbol">${icon('phone')}</div><h2>Your phone number.</h2><p class="sub">We’ll send a code to verify this number and finish setting up your account.</p><form id="form">${google?`${field('Username','username','Choose your @username')}<p class="hint" id="availability">Choose an available username. <button class="link" type="button" id="suggest">Suggest one</button></p>`:''}<label class="field" for="phoneNumber">Phone number</label><div class="input phone-field"><select aria-label="Country calling code" id="country"><option value="+91">IN +91</option><option value="+1">US +1</option><option value="+44">GB +44</option></select><input id="phoneNumber" data-field="phoneNumber" type="tel" value="${escape(data.phoneNumber)}" placeholder="Phone number" required></div><p class="hint">Choose your country, then enter your number.</p><div id="error" class="errorbox" role="alert"></div><button class="primary">Send verification code</button></form><button class="link skip" id="cancel">Cancel registration</button>`}
if(page===5){html+=`<div class="symbol">${icon('lock')}</div><h2>One last check.</h2><p class="sub">Enter the six-digit code sent to<strong class="address">${escape(data.country||'+91')} ${escape(data.phoneNumber||'••••• •••••')}</strong></p><form id="form"><label class="field" for="code">Verification code</label><div class="input code"><input id="code" data-field="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="000000" required></div><div id="error" class="errorbox" role="alert"></div><button class="primary">Verify & finish</button></form><div class="center"><button class="link" id="resend">Resend code</button></div><div class="center"><button class="link" id="changeNumber">Change phone number</button></div><p class="hint center">This preview accepts any six-digit code.</p>`}

document.querySelectorAll('[data-field]').forEach(el=>el.oninput=()=>{data[el.id]=el.value;if(el.id==='password'&&page===1){const n=[el.value.length>=8,/[A-Z]/.test(el.value),/[a-z]/.test(el.value),/\d/.test(el.value)].filter(Boolean).length;document.querySelectorAll('#strength span').forEach((e,i)=>e.classList.toggle('filled',i<n))}if(el.id==='username'&&$('availability')){$('availability').textContent=el.value.length>=3?'Available · sample check':'At least 3 characters.';$('availability').className='hint '+(el.value.length>=3?'good':'')}});

}

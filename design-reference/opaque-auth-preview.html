if($('switch'))$('switch').onclick=()=>{login=!login;go('choose')};
if($('form'))$('form').onsubmit=e=>{e.preventDefault();const error=t=>{$('error').textContent=t};if(page==='details'){if(!login&&data.username.toLowerCase()==='taken')return error('That username is taken. Please choose another.');if(route==='phone'&&data.phoneNumber.replace(/\D/g,'').length<7)return error('Enter a valid phone number.');if(route==='email'&&!login&&(data.password.length<8||!/[A-Z]/.test(data.password)||!/[a-z]/.test(data.password)||!/\d/.test(data.password)))return error('Use at least 8 characters with uppercase, lowercase and a number.');deadline=Date.now()+60000;go(route==='google'?'profile':route==='email'&&login?'home':'verify')}else if(page==='verify'){if($('code').value!=='123456')return error('That code doesn’t match. Try 123456 for this preview.');go(login?'home':'profile')}else if(page==='profile')go('home')};
if($('resend')){$('resend').onclick=()=>{deadline=Date.now()+60000;countdown();notify('Sent again · preview only')};countdown()}if($('verified'))$('verified').onclick=()=>go('profile');if($('edit'))$('edit').onclick=()=>go('details');if($('skip'))$('skip').onclick=()=>{data.displayName='';photo=false;go('home')};if($('photo'))$('photo').onclick=()=>dialog('Add a profile photo','<p>In the app, choose a photo from your phone. Here you can preview a sample avatar.</p>','Use sample',()=>{photo=true;render()});if($('help'))$('help').onclick=()=>dialog('Can’t find the email?','<ol><li>Check spam or junk.</li><li>Allow a few minutes for delivery.</li><li>Check the address you entered.</li><li>Try resending the email.</li></ol>');if($('find'))$('find').onclick=()=>notify('Friend discovery opens here in the app.');if($('restart'))$('restart').onclick=()=>{login=false;go('choose')};}
const media=matchMedia('(prefers-color-scheme: dark)');let theme='system';function applyTheme(){$('phone').classList.toggle('dark',theme==='dark'||theme==='system'&&media.matches);for(const t of ['system','light','dark'])$(t).setAttribute('aria-pressed',String(theme===t))}for(const t of ['system','light','dark'])$(t).onclick=()=>{theme=t;applyTheme()};media.addEventListener('change',applyTheme);applyTheme();
$('routeReview').onchange=e=>{route=e.target.value;login=false;if(route==='google')data.username='veera_sharma';go('details')};$('overlay').onclick=e=>{if(e.target===$('overlay'))closeDialog()};$('overlay').onkeydown=e=>{if(e.key==='Escape')closeDialog();if(e.key==='Tab'){const buttons=$('overlay').querySelectorAll('button'),a=buttons[0],b=buttons[buttons.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();b.focus()}else if(!e.shiftKey&&document.activeElement===b){e.preventDefault();a.focus()}}};render();
</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OPAQUE · Backup & restore preview</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9ebef;color:#202127;font:14px/1.5 Inter,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer;background:none;border:0;color:inherit}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #719cdd;outline-offset:3px}svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.stage{max-width:900px;margin:32px auto;padding:20px;display:flex;align-items:center;gap:70px}.intro{width:280px}.eyebrow{font-size:10px;letter-spacing:2px;color:#788191}.intro h1{font-size:32px;font-weight:600;letter-spacing:-1.2px;line-height:1.15;margin:16px 0}.intro p{font-size:13px;color:#747b87;line-height:1.8}.controls{display:flex;gap:7px;flex-wrap:wrap;margin-top:22px}.controls button{border:1px solid #cdd2da;padding:8px 12px;border-radius:10px;font-size:12px}.controls button.active{background:#303b4c;color:white}.phone{--bg:#fff;--ink:#202127;--muted:#8b929f;--soft:#f3f4f7;--line:#ededf1;--blue:#507fc3;position:relative;width:360px;height:780px;border:1px solid #dcdfe5;border-radius:26px;background:var(--bg);color:var(--ink);overflow:hidden;display:flex;flex-direction:column;flex-shrink:0;box-shadow:0 18px 60px #25334c0b}.phone.dark{--bg:#19202a;--ink:#e0e6ef;--muted:#9ca8bb;--soft:#283241;--line:#303947;--blue:#8aafe4}.status{height:30px;padding:9px 22px 0;display:flex;justify-content:space-between;font-size:11px;font-weight:600}.status span{display:flex;gap:5px}.status svg{width:13px;height:13px}.header{height:61px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);flex-shrink:0}.icon{width:34px;height:38px;display:grid;place-items:center;color:var(--muted)}.wordmark{position:absolute;left:50%;transform:translateX(-50%);font-size:19px;font-weight:700;letter-spacing:2.5px;display:flex;align-items:center;gap:3px}.mark{width:19px;height:19px;border:4px solid var(--ink);border-radius:50%;position:relative}.mark:after{content:'';position:absolute;width:2px;height:27px;background:var(--bg);left:5px;top:-8px;transform:rotate(26deg)}main{overflow:auto;padding:22px 22px 24px;flex:1;scrollbar-width:thin}h2{font-size:22px;letter-spacing:-.6px;font-weight:600;margin:0 0 5px}.sub{font-size:12px;color:var(--muted);line-height:1.7;margin:0}.tabs{display:flex;background:var(--soft);padding:3px;border-radius:16px;margin:22px 0 24px}.tabs button{flex:1;border-radius:13px;padding:7px;font-size:11px;color:var(--muted)}.tabs .active{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px #20212710}.label{font-size:9px;letter-spacing:1.3px;color:var(--muted);margin:24px 0 12px}.summary{display:flex;align-items:center;gap:12px;margin-bottom:18px}.symbol{width:38px;height:38px;border-radius:12px;background:var(--soft);display:grid;place-items:center;color:var(--blue);flex-shrink:0}.summary strong{font-size:13px;font-weight:600}.summary p{font-size:11px;color:var(--muted);margin:3px 0}.primary,.secondary{border-radius:12px;padding:12px 14px;font-size:12px;display:flex;gap:8px;align-items:center;justify-content:center;width:100%}.primary{background:#507fc3;color:white}.secondary{background:var(--soft);color:var(--muted)}.primary svg,.secondary svg{width:16px;height:16px}.row{width:100%;display:flex;align-items:center;gap:11px;padding:14px 0;border-bottom:1px solid var(--line);text-align:left;font-size:12px}.row>svg{width:17px;height:17px;color:var(--muted)}.row .copy{flex:1}.row small{display:block;font-size:10px;color:var(--muted);margin-top:3px}.value{font-size:11px;color:var(--muted)}.chevron{width:14px!important}.toggle{width:31px;height:18px;border-radius:12px;background:#ccd2db;position:relative;flex-shrink:0}.toggle:before{content:'';width:14px;height:14px;border-radius:50%;background:white;position:absolute;top:2px;left:2px}.toggle.on{background:#507fc3}.toggle.on:before{left:15px}.foot{display:flex;gap:7px;align-items:flex-start;color:var(--muted);font-size:10px;line-height:1.7;margin-top:20px}.foot svg{width:13px;height:13px;margin-top:2px}.gesture{height:18px;flex-shrink:0;display:grid;place-items:center}.gesture:before{content:'';height:4px;width:108px;border-radius:9px;background:var(--ink);opacity:.8}.file{display:flex;gap:11px;padding:16px 0;border-bottom:1px solid var(--line);align-items:center}.file .copy{flex:1}.file strong{font-size:12px;font-weight:500}.file small{font-size:10px;color:var(--muted);display:block;margin-top:4px}.file button{color:var(--blue);font-size:11px}.empty{text-align:center;padding:42px 12px}.empty .symbol{margin:0 auto 15px}.empty strong{font-size:14px}.empty p{font-size:12px;color:var(--muted);line-height:1.8}.overlay{position:absolute;inset:0;background:#10182655;display:flex;align-items:flex-end;z-index:5}.sheet{width:100%;background:var(--bg);padding:10px 24px 24px;border-radius:24px 24px 0 0;max-height:90%;overflow:auto}.handle{width:32px;height:3px;background:var(--line);border-radius:3px;margin:0 auto 18px}.sheet-top{display:flex;justify-content:space-between;margin-bottom:16px}.sheet h3{font-size:20px;letter-spacing:-.4px;margin:0 0 8px;font-weight:600}.sheet .sub{margin-bottom:18px}.sheet input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--soft);color:var(--ink);font-size:13px;margin:7px 0 14px}.sheet label{font-size:10px;color:var(--muted);display:block}.sheet .primary{margin-top:18px}.choice{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);width:100%;font-size:12px}.radio{width:16px;height:16px;border:1.3px solid var(--muted);border-radius:50%}.selected .radio{border:5px solid var(--blue)}.error{font-size:11px;color:#bf6974}.danger{background:#bf6974;color:white}.notice{font-size:10px;color:var(--muted);line-height:1.7;margin-top:14px}.progress{height:4px;background:var(--soft);border-radius:4px;margin:24px 0;overflow:hidden}.progress i{display:block;height:100%;background:var(--blue);width:0;transition:width .3s}.toast{position:absolute;bottom:25px;left:20px;right:20px;background:#303b4c;color:white;font-size:12px;padding:12px 16px;border-radius:12px;z-index:8;text-align:center}[hidden]{display:none!important}@media(max-width:680px){.stage{margin:0;padding:16px;gap:20px;flex-direction:column}.intro{width:min(360px,100%)}.intro h1{font-size:25px;margin:10px 0}.intro p{margin:5px 0}.controls{margin-top:12px}.phone{width:min(360px,calc(100vw - 24px));height:780px}.stage{padding-bottom:28px}}
</style></head><body><div class="stage"><aside class="intro"><div class="eyebrow">OPAQUE · DESIGN PREVIEW</div><h1>A little peace<br>of mind.</h1><p>Backup & restore, in the same quiet style as your Notes and conversations.</p><div class="controls"><button id="light" class="active">Light</button><button id="dark">Dark</button><button id="empty">Empty state</button><button id="reset">Reset</button></div><p>Try creating a backup, changing the schedule, or restoring a sample file. Everything here is a preview.</p></aside><div class="phone" id="phone"><div class="status">9:41<span><i data-icon="signal"></i><i data-icon="wifi"></i><i data-icon="battery"></i></span></div><header class="header"><button class="icon" id="back" aria-label="Back"><i data-icon="back"></i></button><div class="wordmark"><span class="mark"></span>PAQUE</div><button class="icon" id="help" aria-label="About backups"><i data-icon="info"></i></button></header><main><h2>Backup & restore</h2><p class="sub">Keep a copy of what matters.</p><div class="tabs" role="tablist"><button class="active" id="backupTab" role="tab" aria-selected="true">Backup</button><button id="restoreTab" role="tab" aria-selected="false">Restore</button></div><section id="content"></section></main><div class="gesture"></div><div class="overlay" id="overlay" hidden><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="handle"></div><div class="sheet-top"><span class="symbol" id="sheetIcon"></span><button class="icon" id="close" aria-label="Close dialog"></button></div><h3 id="sheetTitle"></h3><p class="sub" id="sheetSub"></p><div id="sheetBody"></div></section></div><div class="toast" id="toast" role="status" hidden></div></div></div>
<script>
const paths={back:'<path d="m12 19-7-7 7-7M5 12h14"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/>',close:'<path d="m6 6 12 12M6 18 18 6"/>',up:'<path d="M12 16V3m-5 5 5-5 5 5M4 16v5h16v-5"/>',down:'<path d="M12 3v13m-5-5 5 5 5-5M4 17v4h16v-4"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4M12 14v3"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',folder:'<path d="M3 6h7l2 2h9v12H3z"/>',cloud:'<path d="M6 18a5 5 0 0 1-1-10 7 7 0 0 1 13-1 5.5 5.5 0 0 1 0 11z"/>',photo:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8" cy="8" r="1.5"/><path d="m3 17 6-6 5 5 3-3 4 4"/>',file:'<path d="M14 2H5v20h14V7zM14 2v6h5M8 13h8M8 17h6"/>',right:'<path d="m9 5 7 7-7 7"/>',check:'<path d="m5 12 4 4L19 6"/>',signal:'<path d="M3 20v-4M8 20v-8M13 20V8M18 20V4"/>',wifi:'<path d="M2 8a16 16 0 0 1 20 0M5 12a11 11 0 0 1 14 0M8 16a6 6 0 0 1 8 0M12 20h.01"/>',battery:'<rect x="2" y="6" width="18" height="12" rx="2"/><path d="M23 10v4M5 9h12v6H5z"/>'};
const $=id=>document.getElementById(id), icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${paths[n]||paths.file}</svg>`;
document.querySelectorAll('[data-icon]').forEach(el=>el.outerHTML=icon(el.dataset.icon));$('close').innerHTML=icon('close');
let tab='backup',noBackups=false,automatic=true,frequency='Daily',destination='On this device',media='All media',connected=false,toastTimer,progressTimer,returnFocus;
function toast(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,2600)}
function row(id,ic,title,sub='',value=''){return `<button class="row" id="${id}">${icon(ic)}<span class="copy">${title}${sub?`<small>${sub}</small>`:''}</span>${value?`<span class="value">${value}</span>`:''}<span class="chevron">${icon('right')}</span></button>`}
function render(){for(const t of ['backup','restore']){$(t+'Tab').classList.toggle('active',tab===t);$(t+'Tab').setAttribute('aria-selected',String(tab===t))}
if(tab==='backup'){$('content').innerHTML=`<div class="summary"><span class="symbol">${icon(noBackups?'up':'check')}</span><div><strong>${noBackups?'Your first backup starts here':'Last backup · Today, 09:12'}</strong><p>${noBackups?'Keep your conversations close.':'124 MB · On this device'}</p></div></div><button class="primary" id="create">${icon('up')}Create backup</button><div class="label">BACKUP PREFERENCES</div>${row('destination','folder','Save to','Choose where to keep your backup',destination)}${(destination==='Google Drive'?row('media','photo','Include media','For your Google Drive backup',media):'')}<button class="row" id="automatic" role="switch" aria-checked="${automatic}">${icon('clock')}<span class="copy">Automatic backups<small>On this device · No internet required</small></span><span class="toggle ${automatic?'on':''}"></span></button>${automatic?row('schedule','clock','Frequency','',frequency):''}<div class="label">GOOGLE DRIVE</div>${row('account','cloud',connected?'Preview account connected':'Connect your account',connected?'Sample account · preview only':'Keep a copy in Google Drive')}<p class="foot">${icon('lock')}<span>Backups are protected by your passphrase. Keep it safe — you’ll need it to restore.</span></p>`;
$('create').onclick=create;$('destination').onclick=()=>choices('Save backup to',['On this device','Google Drive'],destination,v=>destination=v);if($('media'))$('media').onclick=()=>choices('Include media',['All media','Last 7 days','Last 15 days','Last 30 days','No media'],media,v=>media=v);$('automatic').onclick=()=>{automatic=!automatic;render()};if(automatic)$('schedule').onclick=()=>choices('Backup frequency',['Daily','Weekly','Monthly'],frequency,v=>frequency=v);$('account').onclick=()=>{sheet('Google Drive','A separate copy, when you need it.','cloud',`<p class="sub">${connected?'A sample account is connected in this preview.':'In the app, you’ll choose a Google account to store your backups.'}</p><button class="primary" id="connect">${connected?'Disconnect sample account':'Preview connected state'}</button><p class="notice">No Google account is accessed by this preview.</p>`);$('connect').onclick=()=>{connected=!connected;close();render()}};
}else{$('content').innerHTML=`<button class="secondary" id="import">${icon('folder')}Import backup file</button><div class="label">AVAILABLE BACKUPS</div>${noBackups?`<div class="empty"><div class="symbol">${icon('folder')}</div><strong>No backups here yet</strong><p>Import a saved backup file or check<br>your Google Drive backups.</p></div>`:[['Today, 09:12','124 MB · This device'],['Yesterday, 09:10','121 MB · This device']].map((f,i)=>`<div class="file"><span class="symbol">${icon('file')}</span><div class="copy"><strong>${f[0]}</strong><small>${f[1]}</small></div><button data-restore="${i}">Restore</button></div>`).join('')}${row('drive','cloud','Google Drive backups','Find a backup saved to your account')}<p class="foot">${icon('lock')}<span>You’ll need the passphrase used to create your backup.</span></p>`;$('import').onclick=()=>restore('Imported sample backup');document.querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>restore(b.dataset.restore==='0'?'Today, 09:12':'Yesterday, 09:10'));$('drive').onclick=()=>{sheet('Google Drive backups','Sample files for reviewing this layout.','cloud',`<div class="file"><span class="symbol">${icon('file')}</span><div class="copy"><strong>Yesterday, 09:10</strong><small>121 MB · Google Drive</small></div><button id="cloudRestore">Restore</button></div>`);$('cloudRestore').onclick=()=>restore('Google Drive · Yesterday')};}}
function sheet(title,sub,ic,html){if($('overlay').hidden)returnFocus=document.activeElement;$('sheetTitle').textContent=title;$('sheetSub').textContent=sub;$('sheetIcon').innerHTML=icon(ic);$('sheetBody').innerHTML=html;$('overlay').hidden=false;($('sheetBody').querySelector('input,button')||$('close')).focus()}
function close(){clearInterval(progressTimer);$('overlay').hidden=true;$('sheetBody').replaceChildren();if(returnFocus?.isConnected)returnFocus.focus()}
function choices(title,items,current,change){sheet(title,'Choose what works for you.','folder',items.map(v=>`<button class="choice ${current===v?'selected':''}" data-value="${v}"><span>${v}</span><span class="radio"></span></button>`).join(''));document.querySelectorAll('[data-value]').forEach(b=>b.onclick=()=>{change(b.dataset.value);close();render()})}
function create(){sheet('Create backup','A copy of your conversations, ready when you need it.','up',`<label>BACKUP PASSPHRASE<input id="pass" type="password" placeholder="Use a sample passphrase" autocomplete="off"></label><label>CONFIRM PASSPHRASE<input id="confirmPass" type="password" placeholder="Enter it again" autocomplete="off"></label><div class="error" id="error" role="alert"></div><button class="primary" id="start">Create backup</button><p class="notice">Preview only. Use sample text, not a real password. Nothing is saved or uploaded.</p>`);$('start').onclick=()=>{if(!$('pass').value.trim()){$('error').textContent='Enter a sample passphrase.';return}if($('pass').value!==$('confirmPass').value){$('error').textContent='The passphrases don’t match.';return}progress(false)}}
function restore(name){sheet('Restore backup',name+' · Sample file','down',`<p class="sub">Enter the passphrase used to create this backup.</p><label>PASSPHRASE<input id="pass" type="password" placeholder="Use any sample passphrase" autocomplete="off"></label><div class="error" id="error" role="alert"></div><button class="primary" id="start">Continue</button><p class="notice">This preview does not read files or change your messages.</p>`);$('start').onclick=()=>{if(!$('pass').value.trim()){$('error').textContent='Enter a sample passphrase.';return}sheet('Restore this backup?','Bring your saved conversations back.','down',`<p class="sub">You’re reviewing the restore confirmation. No real data will be restored.</p><button class="primary" id="restoreConfirm">Restore backup</button>`);$('restoreConfirm').onclick=()=>progress(true)}}
function progress(restoring){sheet(restoring?'Restoring backup…':'Creating backup…','Previewing progress.','clock','<div class="progress"><i id="bar"></i></div><p class="sub" id="progressText" role="status">Preparing…</p>');let p=0;clearInterval(progressTimer);progressTimer=setInterval(()=>{p+=20;$('bar').style.width=p+'%';$('progressText').textContent=p+'% · '+(restoring?'Restoring sample data':'Preparing sample backup');if(p>=100){clearInterval(progressTimer);noBackups=false;render();sheet(restoring?'Backup restored':'Backup created','All done — in this preview.','check',`<p class="sub">${restoring?'Your sample conversations are ready.':'Your sample backup is ready.'}</p><button class="primary" id="done">Done</button><p class="notice">No files or app data were changed.</p>`);$('done').onclick=close}},350)}
$('close').onclick=close;$('overlay').onclick=e=>{if(e.target===$('overlay'))close()};document.addEventListener('keydown',e=>{if($('overlay').hidden)return;if(e.key==='Escape')close();if(e.key==='Tab'){const els=[...$('overlay').querySelectorAll('button,input')],first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
for(const mode of ['light','dark'])$(mode).onclick=()=>{$('phone').classList.toggle('dark',mode==='dark');$('light').classList.toggle('active',mode==='light');$('dark').classList.toggle('active',mode==='dark')};$('backupTab').onclick=()=>{tab='backup';render()};$('restoreTab').onclick=()=>{tab='restore';render()};$('empty').onclick=()=>{noBackups=!noBackups;$('empty').classList.toggle('active',noBackups);render()};$('reset').onclick=()=>{close();noBackups=false;automatic=true;frequency='Daily';destination='On this device';media='All media';connected=false;tab='backup';$('empty').classList.remove('active');render()};$('back').onclick=()=>toast('Backup & restore design preview');$('help').onclick=()=>sheet('About backups','A copy you can come back to.','info','<p class="sub">Create a backup on your device or in Google Drive. Choose which media to include, and set a schedule for automatic backups.</p><p class="sub">Keep your backup passphrase somewhere safe. You’ll need it when restoring a saved backup.</p><p class="notice">This is an interactive design preview using sample data.</p>');render();
</script>
<script>
let autoPassword=false,deletedFiles=new Set(),renamedFiles={},cloudDeleted=false;
const originalRender=render;
render=function(){originalRender();if(tab==='backup'){
  if(automatic){const details=document.createElement('div');details.innerHTML=`${!autoPassword?row('autoPassword','lock','Set backup passphrase','Required for automatic backups'):''}<p class="notice">${autoPassword?'Next backup · Tomorrow, 09:12':'Set a passphrase to schedule your first automatic backup.'}</p>${row('batterySettings','info','Background access','Allow backups while the app is closed')}`;$('schedule').after(details);if($('autoPassword'))$('autoPassword').onclick=()=>{sheet('Auto-backup passphrase','Protect your scheduled backups.','lock','<label>PASSPHRASE<input type="password" id="autoPass" placeholder="Use a sample passphrase"></label><div id="autoError" class="error"></div><button class="primary" id="saveAuto">Save passphrase</button><p class="notice">Preview only. Do not enter a real password.</p>');$('saveAuto').onclick=()=>{if(!$('autoPass').value.trim()){$('autoError').textContent='Enter a sample passphrase.';return}autoPassword=true;close();render()}};$('batterySettings').onclick=()=>sheet('Background access','Keep scheduled backups running.','clock','<p class="sub">The app can open Android battery settings so you can allow it to run in the background.</p><button class="primary" id="batteryDone">Got it</button>');details.addEventListener('click',()=>{if($('batteryDone'))$('batteryDone').onclick=close})}
  $('account').onclick=()=>{sheet('Google Drive',connected?'Sample account connected':'Keep a separate copy of your backup.','cloud',connected?'<button class="choice" id="changeAccount">Change account</button><button class="choice" id="signOut">Sign out</button><p class="notice">Sample account only. No account is accessed.</p>':'<button class="primary" id="connectAccount">Preview sign-in</button><p class="notice">No Google sign-in is performed in this preview.</p>');if(connected){$('changeAccount').onclick=()=>{close();toast('Sample account changed')};$('signOut').onclick=()=>{sheet('Sign out of Google Drive?','Your existing backup files will stay in Drive.','cloud','<button class="primary danger" id="signOutConfirm">Sign out</button>');$('signOutConfirm').onclick=()=>{connected=false;close();render()}}}else $('connectAccount').onclick=()=>{connected=true;close();render()}};
}else{
 document.querySelectorAll('[data-restore]').forEach(b=>{const id=b.dataset.restore,f=b.closest('.file');if(deletedFiles.has(id)){f.remove();return}if(renamedFiles[id])f.querySelector('strong').textContent=renamedFiles[id];const more=document.createElement('button');more.textContent='⋮';more.setAttribute('aria-label','Backup options');more.onclick=()=>fileOptions(id,f.querySelector('strong').textContent);f.append(more)});
 $('drive').onclick=()=>{sheet('Google Drive backups','Sample backup folders and files.','cloud',cloudDeleted?'<p class="sub">No Google Drive backups found.</p>':'<button class="row" id="cloudFolder">'+icon('folder')+'<span class="copy">Opaque backup<small>Yesterday · 121 MB</small></span>'+icon('right')+'</button><button class="secondary" id="deleteCloud">Delete backup</button>');if($('cloudFolder'))$('cloudFolder').onclick=()=>{sheet('Opaque backup','Select the backup file to restore.','folder','<button class="row" id="cloudFile">'+icon('file')+'<span class="copy">messages.encrypted<small>Yesterday · Google Drive</small></span>'+icon('right')+'</button>');$('cloudFile').onclick=()=>restore('Google Drive · messages.encrypted')};if($('deleteCloud'))$('deleteCloud').onclick=()=>confirmDelete(()=>{cloudDeleted=true;close();toast('Sample backup deleted')})};
}}
function confirmDelete(action){sheet('Delete backup?','This backup file will be removed. Your current conversations will stay.','file','<button class="primary danger" id="deleteConfirm">Delete backup</button><p class="notice">Only sample data is affected in this preview.</p>');$('deleteConfirm').onclick=action}
function fileOptions(id,name){sheet('Backup options',name,'file','<button class="choice" id="renameFile">Rename</button><button class="choice" id="restoreFile">Restore</button><button class="choice" id="deleteFile">Delete</button>');$('restoreFile').onclick=()=>restore(name);$('deleteFile').onclick=()=>confirmDelete(()=>{deletedFiles.add(id);if(deletedFiles.size===2)noBackups=true;close();render()});$('renameFile').onclick=()=>{sheet('Rename backup','Give this backup a name you’ll recognise.','file','<label>BACKUP NAME<input id="fileName" maxlength="60"></label><div id="nameError" class="error"></div><button class="primary" id="renameConfirm">Rename</button>');$('fileName').value=name;$('renameConfirm').onclick=()=>{if(!$('fileName').value.trim()){$('nameError').textContent='Enter a backup name.';return}renamedFiles[id]=$('fileName').value.trim();close();render()}}}
const baseProgress=progress;progress=function(restoring){baseProgress(restoring);if(!restoring){const cancel=document.createElement('button');cancel.className='secondary';cancel.textContent='Cancel backup';cancel.onclick=()=>{close();toast('Sample backup cancelled')};$('sheetBody').append(cancel)}};
const baseReset=$('reset').onclick;$('reset').onclick=()=>{autoPassword=false;deletedFiles.clear();renamedFiles={};cloudDeleted=false;baseReset()};render();
</script>
</body></html>
